name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: true
      - name: Check download bridge
        run: node --test tests/download-bridge.test.cjs
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/haeyang-gif-studio.apk
          cd dist
          sha256sum haeyang-gif-studio.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: haeyang-gif-studio-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
